framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        prefix_seed: survos.packages

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # PostgreSQL, on the application's own connection (table cache_items, created
        # on first use). Web and every worker run in separate containers and the
        # load worker writes from 32 processes at once, so the cache must be shared
        # and take concurrent writers -- which rules out a SQLite file.
        app: cache.adapter.doctrine_dbal
        default_doctrine_dbal_provider: doctrine.dbal.default_connection

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        #pools:
            #my.dedicated.cache: null
        # creates a "my_cache_pool" service
        # autowireable via "CacheInterface $myCachePool"
#        my_cache_pool:
#            adapter: cache.adapter.filesystem
