# Doctrine subject store is the default; no application adapter needed.
survos_workflow_messenger:
    # Transitions of the same package never run concurrently across workers.
    lock_factory: lock.database.factory
    # One Doctrine queue per async transition, declared by the bundle from the
    # #[Transition(async: true)] attributes in src/Workflow. The queue is the
    # messenger_messages table of the application's own PostgreSQL database.
    transport_dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
    driver: doctrine
    # Remote rate limits last minutes, not seconds: 30 s, 2 min, 8 min, 32 min, 1 h.
    retry_strategy: { max_retries: 5, delay: 30000, multiplier: 4, max_delay: 3600000 }
